name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PRAMAAN_API_KEY: ""
  PRAMAAN_FAKE: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_test?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_test?schema=public
  ALLOWED_SIGN_IN: example.com
  BETTER_AUTH_SECRET: ci-only-secret-regenerate-for-any-real-deployment
  API_URL: http://localhost:3001
  APP_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-only-google-client-id
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - run: bun install --frozen-lockfile
      - if: matrix.check == 'lint'
        run: |
          bun run lint
      - if: matrix.check == 'typecheck'
        run: |
          bun run --cwd apps/app typegen
          bun run check-types
      - if: matrix.check == 'build'
        run: bun run build
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
      - run: bun install --frozen-lockfile
      - run: bun run db:deploy
      - run: bun run test
