
services:
  postgres:
    image: postgres:17-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      # Unusual host port on purpose: 5432 belongs to any Postgres the person
      # already runs, and shadowing it would send migrations to the wrong
      # database. The app reaches this one at localhost:54329.
      - "54329:5432"
    volumes:
      - crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  crm-postgres:
